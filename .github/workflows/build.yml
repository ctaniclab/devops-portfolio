name: Build Mail Archive

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download public OST/PST test fixtures
        shell: pwsh
        run: ./tests/Get-Fixtures.ps1
      - name: Check archive reading and file protection
        shell: pwsh
        env:
          MAILARCHIVE_MSG_CHECK_OUTPUT: ${{ runner.temp }}/mailarchive-independent-msg
        run: |
          dotnet run --project tests/MailArchive.Checks -c Release -- tests/fixtures/example-2013.ost tests/fixtures/dist-list.pst 2>&1 | Tee-Object -FilePath checks.log
          $checkExit = $LASTEXITCODE
          if ($checkExit -ne 0) {
            '### Portable check failure' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```text' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content checks.log -Tail 60 | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit $checkExit
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exported MSG with an independent reader
        shell: pwsh
        run: |
          python -m pip install extract-msg==0.55.0
          if ($LASTEXITCODE -ne 0) { throw 'Independent MSG reader install failed.' }
          python tests/Verify-Msg.py (Join-Path $env:RUNNER_TEMP 'mailarchive-independent-msg')
          if ($LASTEXITCODE -ne 0) { throw 'Independent MSG verification failed.' }
      - name: Build Outlook integration check
        run: dotnet build tests/MailArchive.WindowsChecks -c Release
      # Hosted runners do not have a configured Outlook profile; do not run Outlook conversion here.
      - name: Package Windows application
        shell: pwsh
        run: ./Build.ps1
      - name: Scan release with Microsoft Defender
        shell: pwsh
        run: ./scripts/Scan-Defender.ps1 -ScanPath dist/win-x64 -ReportPath dist/defender-report.json
      - name: Verify HTML preview in the published EXE
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'mailarchive-preview.json'
          $process = Start-Process (Resolve-Path dist/win-x64/MailArchive.exe).Path -ArgumentList @('--self-check-output', $report, '--fixture', (Resolve-Path tests/fixtures/example-2013.ost).Path) -PassThru
          if (-not $process.WaitForExit(150000)) { $process.Kill(); throw 'Published EXE self-check timed out.' }
          if (Test-Path $report) { Copy-Item $report dist/preview-report.json }
          if ($process.ExitCode -ne 0) {
            $detail = if (Test-Path $report) { (Get-Content $report -Raw | ConvertFrom-Json).Error } else { 'No report was written.' }
            Write-Output "::error title=Published EXE preview check failed::Exit code $($process.ExitCode): $detail"
            throw 'Published EXE self-check failed.'
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.GlassPanelsVerified -or -not $result.DisabledTreeVerified -or -not $result.TabBoundsVerified -or -not $result.OfflineMsgExportVerified) { throw 'Glass panels, disabled tree, tab clipping or offline MSG export check failed.' }
          if (-not $result.HtmlRenderingVerified -or -not $result.MainWindowVerified -or -not $result.ReaderWindowVerified -or -not $result.ThemedScrollBarsVerified -or -not $result.ExportWizardVerified -or -not $result.AllThemesVerified -or -not $result.NativeCaptionApiAccepted -or -not $result.NativeDarkModeVerified -or -not $result.GlassFallbackVerified -or -not $result.ConversionProgressUiVerified -or -not $result.ExecutableIconVerified) { throw 'Email HTML rendering or application UI was not verified.' }
          Copy-Item $report dist/preview-report.json
          Copy-Item "$report.png" dist/ui-preview.png
          Copy-Item "$report.dark.png" dist/ui-dark.png
          Copy-Item "$report.reader.png" dist/ui-reader.png
          Copy-Item "$report.wizard.png" dist/ui-export-wizard.png
          Copy-Item "$report.classic.window.png" dist/ui-classic-window.png
          Copy-Item "$report.space.window.png" dist/ui-space-window.png
          foreach ($theme in @('liquid', 'transparent', 'aurora', 'neon', 'terminal')) { Copy-Item "$report.$theme.window.png" "dist/ui-$theme-window.png" }
          Copy-Item "$report.liquid-fallback.png" dist/ui-liquid-fallback.png
          Copy-Item "$report.progress.png" dist/ui-progress.png
          foreach ($theme in @('classic', 'liquid', 'transparent', 'space', 'ocean', 'aurora', 'neon', 'terminal')) { Copy-Item "$report.$theme.png" "dist/ui-$theme.png" }
      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item dist/win-x64/MailArchive.exe dist/MailArchive-1.6.1.exe
          (Get-FileHash dist/MailArchive-1.6.1.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  MailArchive-1.6.1.exe' | Set-Content -Encoding ascii dist/MailArchive-1.6.1.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MailArchive-1.6.1-verified
          path: |
            dist/MailArchive-1.6.1.exe
            dist/MailArchive-1.6.1.exe.sha256
            dist/MailArchive-win-x64.zip
            dist/defender-report.json
            dist/defender-report.json.txt
            dist/preview-report.json
            dist/ui-preview.png
            dist/ui-dark.png
            dist/ui-reader.png
            dist/ui-export-wizard.png
            dist/ui-classic.png
            dist/ui-liquid.png
            dist/ui-transparent.png
            dist/ui-aurora.png
            dist/ui-neon.png
            dist/ui-terminal.png
            dist/ui-liquid-window.png
            dist/ui-transparent-window.png
            dist/ui-aurora-window.png
            dist/ui-neon-window.png
            dist/ui-terminal-window.png
            dist/ui-liquid-fallback.png
            dist/ui-progress.png
            dist/ui-space.png
            dist/ui-ocean.png
            dist/ui-classic-window.png
            dist/ui-space-window.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: MailArchive-check-failure
          path: |
            dist/defender-report.json*
            dist/preview-report.json
            dist/ui-preview.png
            dist/ui-dark.png
            dist/ui-reader.png
            dist/ui-export-wizard.png
            dist/ui-classic.png
            dist/ui-liquid.png
            dist/ui-transparent.png
            dist/ui-aurora.png
            dist/ui-neon.png
            dist/ui-terminal.png
            dist/ui-liquid-window.png
            dist/ui-transparent-window.png
            dist/ui-aurora-window.png
            dist/ui-neon-window.png
            dist/ui-terminal-window.png
            dist/ui-liquid-fallback.png
            dist/ui-progress.png
            dist/ui-space.png
            dist/ui-ocean.png
            dist/ui-classic-window.png
            dist/ui-space-window.png
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/mail-archive-download'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MailArchive-1.6.1-verified
          path: release
      - name: Publish only after tests, preview and Defender passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view v1.6.1 >/dev/null 2>&1; then
            echo 'Version v1.6.1 already exists; existing assets will not be overwritten.'
            exit 0
          fi
          gh release create v1.6.1 --target '${{ github.sha }}' --title 'Mail Archive 1.6.1' --notes 'Adds a durable per-message conversion journal, recipient address/role and sender verification, and isolation of newly moved PST items that fail validation. Selection loading can be cancelled; full folder paths distinguish similarly named folders. Search waits for a short typing pause. Tab spacing no longer clips rounded right edges and Windows UI checks now check horizontal bounds. Includes 165 portable checks, six independently verified MSG fixtures, Windows EXE UI/MSG checks and Defender scan. PST automation on a real Outlook profile and HDR hardware remain untested on hosted CI. Automatic resume is not supported; existing account messages are never deleted.' release/*
